[www]

; Listen on all IPv4 interfaces on port 9000
listen = 0.0.0.0:9000

; These options apply to Unix sockets.
; They are not used when listen is configured with TCP.
listen.owner = anonim
listen.group = anonim
listen.mode = 0660

; Use dynamic process management
pm = dynamic

; Maximum number of child processes
pm.max_children = 50

; Number of child processes created on startup
pm.start_servers = 8

; Minimum number of idle spare servers
pm.min_spare_servers = 4

; Maximum number of idle spare servers
pm.max_spare_servers = 16

; Maximum requests per child before respawning
pm.max_requests = 1000

; Process idle timeout
pm.process_idle_timeout = 10s

; Memory limit per PHP process
php_admin_value[memory_limit] = 256M

; Upload limits
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 25M
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
php_admin_value[max_input_vars] = 3000

; Error logging
php_admin_value[error_log] = /var/log/php-fpm/www-error.log
php_admin_flag[display_errors] = off
php_admin_flag[display_startup_errors] = off
php_admin_flag[log_errors] = on

; Security: Disable dangerous functions
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source

; Security: Disable dangerous classes
php_admin_value[disable_classes] =

; Session security
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.cookie_secure] = 1
php_admin_value[session.use_strict_mode] = 1
php_admin_value[session.cookie_samesite] = Lax

; Set correct timezone
php_admin_value[date.timezone] = UTC

; OPcache settings for development
php_admin_flag[opcache.enable] = on

; Check changed PHP files on every request
php_admin_flag[opcache.validate_timestamps] = on
php_admin_value[opcache.revalidate_freq] = 0

php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.interned_strings_buffer] = 16
php_admin_value[opcache.max_accelerated_files] = 10000
php_admin_value[opcache.save_comments] = 1
php_admin_value[opcache.max_wasted_percentage] = 5
php_admin_value[opcache.use_cwd] = 1
php_admin_value[opcache.enable_file_override] = 0
