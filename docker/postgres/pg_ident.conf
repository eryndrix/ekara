# -----------------------------------------------------------------------------
# PostgreSQL User Name Maps
# -----------------------------------------------------------------------------
# Format: MAPNAME  SYSTEM-USERNAME  PG-USERNAME
#
# MAPNAME references the "map" parameter in pg_hba.conf.
# SYSTEM-USERNAME is the OS username.
# PG-USERNAME is the PostgreSQL role name.
#
# Example:
# mymap         postgres          admin
# mymap         root              postgres
