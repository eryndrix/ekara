; =====================================================================
; Enable PHP engine
; =====================================================================
engine = On

; =====================================================================
; Memory and execution limits
; =====================================================================
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 3000

; =====================================================================
; Upload limits
; =====================================================================
upload_max_filesize = 20M
post_max_size = 25M

; =====================================================================
; Error handling
; =====================================================================
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; =====================================================================
; Error logging fine-tuning
; =====================================================================
log_errors_max_len = 1024
ignore_repeated_errors = On
ignore_repeated_source = On
html_errors = Off

; =====================================================================
; File system
; =====================================================================
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; =====================================================================
; Remote file access
; =====================================================================
allow_url_fopen = On
allow_url_include = Off

; =====================================================================
; Session security
; =====================================================================
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.gc_maxlifetime = 14400

; =====================================================================
; Disable exposure of PHP version
; =====================================================================
expose_php = Off

; =====================================================================
; Trust custom CA certificate
; =====================================================================
curl.cainfo = /certs/ca.crt
openssl.cafile = /certs/ca.crt

; =====================================================================
; OPcache + JIT (HIGHLOAD FINAL: aggressive hot thresholds)
; =====================================================================
[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 65536
opcache.save_comments = 1
opcache.max_wasted_percentage = 10

; JIT: 1255 = tracing + opt_level=5 + opt_flags=6
opcache.jit = 1255
opcache.jit_buffer_size = 512M

; Hot thresholds — АГРЕССИВНО (в 2× ниже baseline)
opcache.jit_hot_loop = 32
opcache.jit_hot_func = 64
opcache.jit_hot_return = 8
opcache.jit_hot_side_exit = 16

; Trace buffers — увеличены под churn
opcache.jit_max_root_traces = 16384
opcache.jit_max_side_traces = 512
opcache.jit_max_exit_counters = 16384

; Limits (PHP 8.5 validated)
opcache.jit_max_trace_length = 1024
opcache.jit_max_loop_unrolls = 8
opcache.jit_max_recursive_calls = 4
opcache.jit_max_recursive_returns = 3
opcache.jit_max_polymorphic_calls = 4

; Blacklist / bisect
opcache.jit_bisect_limit = 0
opcache.jit_blacklist_root_trace = 64
opcache.jit_blacklist_side_trace = 32
opcache.jit_prof_threshold = 0.005
opcache.jit_debug = 0

; =====================================================================
; APCu
; =====================================================================
[apcu]
apc.enabled = 1
apc.shm_size = 128M
apc.ttl = 7200
apc.user_ttl = 7200
apc.gc_ttl = 3600
apc.enable_cli = 1
apc.serializer = php

; =====================================================================
; Redis
; =====================================================================
[redis]
redis.default_host = redis
redis.default_port = 6379
redis.default_timeout = 2.5
redis.default_retry_interval = 100

; =====================================================================
; PDO
; =====================================================================
[PDO]
pdo_pgsql.default_socket = /tmp/.s.PGSQL.5432

; =====================================================================
; Date
; =====================================================================
[Date]
date.timezone = UTC

; =====================================================================
; mbstring
; =====================================================================
[mbstring]
mbstring.func_overload = 0

; =====================================================================
; intl
; =====================================================================
[intl]
intl.default_locale = en_US.UTF-8

; =====================================================================
; PHP-FPM
; =====================================================================
[php-fpm]
max_input_vars = 3000
output_buffering = 4096