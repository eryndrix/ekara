# -----------------------------------------------------------------------------
# SSL / TLS Configuration
# -----------------------------------------------------------------------------
ssl = on

# Path to the server SSL certificate file
ssl_cert_file = '/var/lib/postgresql/certs/postgres.crt'

# Path to the server SSL private key file
ssl_key_file = '/var/lib/postgresql/certs/postgres.key'

# Path to the Certificate Authority (CA) certificate for verifying client certificates
ssl_ca_file = '/var/lib/postgresql/certs/ca.crt'

# -----------------------------------------------------------------------------
# TimescaleDB Configuration
# -----------------------------------------------------------------------------
shared_preload_libraries = 'timescaledb'

# -----------------------------------------------------------------------------
# Authentication Configuration
# -----------------------------------------------------------------------------
hba_file = '/etc/postgresql/pg_hba.conf'
ident_file = '/etc/postgresql/pg_ident.conf'

# -----------------------------------------------------------------------------
# Connection Settings
# -----------------------------------------------------------------------------

# Listen on all network interfaces (Docker container)
listen_addresses = '0.0.0.0'

# Port number PostgreSQL listens on
port = 5432

# -----------------------------------------------------------------------------
# Connection and Authentication Timeout Settings
# -----------------------------------------------------------------------------
tcp_keepalives_idle = 60
tcp_keepalives_interval = 30
tcp_keepalives_count = 10

# -----------------------------------------------------------------------------
# Logging Configuration
# -----------------------------------------------------------------------------
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0640
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000
log_connections = on
log_disconnections = on

# -----------------------------------------------------------------------------
# Timezone Configuration
# -----------------------------------------------------------------------------
timezone = 'Asia/Yekaterinburg'
log_timezone = 'Asia/Yekaterinburg'

# -----------------------------------------------------------------------------
# Performance Settings
# -----------------------------------------------------------------------------
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 128MB
checkpoint_timeout = 15min
