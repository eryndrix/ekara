services:
  # MailHog service for dev email
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - app-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

# Empty volumes
volumes: {}

# External network
networks:
  app-network:
    external: true
